<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TaskFund — অ্যাডমিন প্যানেল</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>

<!-- লগইন স্ক্রিন -->
<div id="loginBox" class="login-box">
  <h1 class="screen-title">অ্যাডমিন লগইন</h1>
  <p class="screen-sub">শুধু অ্যাডমিন ইমেইল দিয়ে লগইন করা যাবে।</p>
  <input type="email" id="loginEmail" placeholder="ইমেইল" />
  <input type="password" id="loginPassword" placeholder="পাসওয়ার্ড" />
  <button id="loginBtn" class="btn btn-primary btn-block">লগইন করুন</button>
  <div id="loginError" class="callout error hidden" style="margin-top:12px;"></div>
</div>

<!-- অ্যাডমিন ড্যাশবোর্ড -->
<div id="adminDashboard" class="admin-wrap hidden">
  <div class="admin-header">
    <span class="brand" style="font-size:16px;color:var(--green);font-weight:700;">TaskFund — অ্যাডমিন</span>
    <button class="btn btn-outline-green" onclick="logout()">লগআউট</button>
  </div>

  <div class="admin-tabs">
    <button id="tabBtnActivations" class="active" onclick="switchAdminTab('activations')">অ্যাক্টিভেশন (<span id="countActivations">0</span>)</button>
    <button id="tabBtnTasks" onclick="switchAdminTab('tasks')">টাস্ক স্ক্রিনশট (<span id="countTasks">0</span>)</button>
    <button id="tabBtnWithdrawals" onclick="switchAdminTab('withdrawals')">উইথড্র্র (<span id="countWithdrawals">0</span>)</button>
    <button id="tabBtnServices" onclick="switchAdminTab('services')">সার্ভিস (<span id="countServices">0</span>)</button>
    <button id="tabBtnSettings" onclick="switchAdminTab('settings')">সেটিংস</button>
  </div>

  <div id="panelActivations" class="admin-panel"></div>
  <div id="panelTasks" class="admin-panel hidden"></div>
  <div id="panelWithdrawals" class="admin-panel hidden"></div>
  <div id="panelServices" class="admin-panel hidden"></div>
  <div id="panelSettings" class="admin-panel hidden">
    <div class="admin-card" style="display:block;">
      <p class="label" style="margin-bottom:10px;">bKash/নগদ পেমেন্ট নম্বর</p>
      <p style="font-size:12px;color:var(--muted);margin:0 0 10px;">এই নম্বরটাই ইউজাররা অ্যাক্টিভেশনের সময় দেখবে এবং এখানে টাকা পাঠাবে।</p>
      <input type="text" id="settingsPaymentNumber" placeholder="যেমন 01XXXXXXXXX" />

      <p class="label" style="margin-top:16px;margin-bottom:10px;">ন্যূনতম উইথড্র্র পরিমাণ (৳)</p>
      <p style="font-size:12px;color:var(--muted);margin:0 0 10px;">এর কম ব্যালেন্স থাকলে ইউজার উইথড্র্র করতে পারবে না।</p>
      <input type="text" id="settingsMinWithdraw" placeholder="যেমন 50" />

      <button class="btn btn-primary btn-block" onclick="saveSettings()">সেভ করুন</button>
      <p id="settingsSavedMsg" class="hidden" style="color:var(--green);font-size:13px;margin-top:10px;">সেভ হয়েছে ✓</p>
    </div>
  </div>
</div>

<!-- সার্ভিস অ্যাড/এডিট ফর্ম মোডাল -->
<div id="taskFormModal" class="modal-overlay hidden">
  <div class="modal-box">
    <div class="modal-header">
      <h3 id="taskFormTitle">নতুন সার্ভিস</h3>
      <button class="modal-close" onclick="closeTaskForm()">✕</button>
    </div>
    <input type="text" id="taskFormBrand" placeholder="ব্র্যান্ড (যেমন Facebook, YouTube, Instagram)" />
    <input type="text" id="taskFormTaskTitle" placeholder="টাস্কের শিরোনাম (যেমন পেজ ফলো করুন)" />
    <input type="text" id="taskFormReward" placeholder="পুরস্কার (টাকা, যেমন 5)" />
    <input type="text" id="taskFormUrl" placeholder="যে পেজ/লিংক ফলো করতে হবে (পুরো URL)" />
    <textarea id="taskFormInstructions" placeholder="কীভাবে করবে তার ধাপে ধাপে নির্দেশনা" rows="5" style="width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);font-family:inherit;font-size:13px;margin-bottom:12px;box-sizing:border-box;"></textarea>
    <label style="display:flex;align-items:center;gap:8px;font-size:13px;margin-bottom:16px;">
      <input type="checkbox" id="taskFormActive" checked style="width:auto;margin:0;" /> সক্রিয় (ইউজাররা অ্যাপে দেখতে পাবে)
    </label>
    <button class="btn btn-primary btn-block" onclick="saveTaskForm()">সেভ করুন</button>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="admin.js"></script>
</body>
</html>
